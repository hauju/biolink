        <!-- Structured Data -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebPage",
                "@id": "https://haukejung.de/friends.html",
                "url": "https://haukejung.de/friends.html",
                "name": "Friends - Hauke Jung",
                "about": { "@id": "https://haukejung.de/#person" }
            }

        <title>Friends - Hauke Jung</title>

        <link href="./tailwind.css" rel="stylesheet" type="text/css" />
        <link rel="preload" as="image" href="assets/images/hauju-288.webp" type="image/webp" fetchpriority="high" />

        <!-- Favicons -->
        <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png" />
        <script
            defer
            src="./assets/js/analytics.js"
            data-website-id="ee3ec123-3c7d-4354-8272-2d6f1e528e3c"
            data-host-url="https://umami.oxidt.com"
        ></script>

        <style>
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .fade-in {
                animation: fadeIn 0.6s ease-out forwards;
            }

            .link-card {
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .link-card:hover {
                transform: translateY(-2px);
            }

            .link-card:active {
                transform: translateY(0);
            }

            @keyframes friendIn {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* Cards are rendered by JS, hidden until they cascade in. */
            .friend-card {
                opacity: 0;
                animation: friendIn 0.45s ease-out forwards;
            }

            @media (prefers-reduced-motion: reduce) {
                .friend-card {
                    opacity: 1;
                    animation: none;
                }
            }
        </style>
    </head>

    <body class="antialiased bg-ink-950 text-stone-200 min-h-[100dvh]">
        <main
            class="py-12 px-4 sm:px-6"
        >
            <div class="max-w-3xl mx-auto">
                <!-- Top Nav -->
                <nav
                    aria-label="Primary"
                    class="flex flex-wrap justify-center gap-4 sm:gap-6 text-sm mb-10"
                >
                    <a
                        href="/"
                        class="text-stone-500 hover:text-stone-100 transition-colors"
                        >Home</a
                    >
                    <a
                        href="/freelance.html"
                        class="text-stone-500 hover:text-stone-100 transition-colors"
                        >Freelance</a
                    >
                    <a
                        href="/open-source.html"
                        class="text-stone-500 hover:text-stone-100 transition-colors"
                        >Open Source</a
                    >
                    <a
                        href="/about.html"
                        class="text-stone-500 hover:text-stone-100 transition-colors"
                        >About</a
                    >
                </nav>

                <!-- Header -->
                <header class="text-center fade-in">
                    <div class="inline-block relative">
                        <picture>
                            <source srcset="assets/images/hauju-288.webp" type="image/webp" />
                            <img
                                src="assets/images/hauju-288.jpg"
                                alt="Hauke Jung"
                                width="112"
                                height="112"
                                fetchpriority="high"
                                decoding="async"
                                class="h-28 w-28 rounded-md border border-white/10 object-cover"
                            />
                        </picture>
                    </div>
                    <h1
                        class="mt-6 text-3xl md:text-4xl font-semibold text-stone-100 font-mono tracking-tight"
                    >
                        Friends
                    </h1>
                    <p
                        class="mt-3 text-base text-stone-400 max-w-md mx-auto leading-relaxed"
                    >
                        If you liked my site, take a look at what these folks are
                        building. Good people, great work. 🤝
                    </p>
                </header>

                <!-- Friends Grid (rendered + shuffled by the script below) -->
                <section
                    id="friends-grid"
                    class="mt-12 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"
                    aria-label="Friends"
                ></section>

                <!-- Footer -->
                <footer class="mt-16 text-center">
                    <p class="text-stone-500 text-sm">
                        Made with <span class="text-red-500">♥</span> by Hauke
                        Jung
                    </p>
                </footer>
            </div>
        </main>

        <script>
            // ── Edit your friends here ──────────────────────────────────────
            // Just add { name, url } - the favicon and domain label fill in
            // automatically. These are placeholder examples; swap them out.
            const friends = [
                { name: "Ada Sterling", url: "https://ada-sterling.example" },
                { name: "Milo Vance", url: "https://milovance.example" },
                { name: "Nora Fields", url: "https://norafields.example" },
                { name: "Theo Park", url: "https://theo.example" },
                { name: "Ines Roca", url: "https://inesroca.example" },
                { name: "Kai Brenner", url: "https://kaibrenner.example" },
                { name: "Lena Voss", url: "https://lenavoss.example" },
                { name: "Ravi Anand", url: "https://ravianand.example" },
            ];
            // ────────────────────────────────────────────────────────────────

            const prefersReducedMotion = window.matchMedia(
                "(prefers-reduced-motion: reduce)",
            ).matches;

            // Fisher–Yates shuffle - fresh random order on every reload.
            function shuffle(list) {
                const arr = [...list];
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function domainOf(url) {
                try {
                    return new URL(url).hostname.replace(/^www\./, "");
                } catch {
                    return url;
                }
            }

            function cardFor(friend, index) {
                const domain = domainOf(friend.url);
                const delay = prefersReducedMotion
                    ? "0s"
                    : (index * 0.05).toFixed(2) + "s";
                const favicon = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64`;

                const a = document.createElement("a");
                a.href = friend.url;
                a.target = "_blank";
                a.rel = "noopener";
                a.style.animationDelay = delay;
                a.setAttribute("aria-label", `${friend.name} - ${domain}`);
                a.className =
                    "friend-card link-card group flex items-center gap-3 bg-white/[0.02] hover:bg-white/[0.04] border border-white/[0.08] hover:border-rust-orange/40 rounded-md px-3.5 py-3 focus:outline-none focus-visible:ring-2 focus-visible:ring-rust-orange focus-visible:ring-offset-2 focus-visible:ring-offset-ink-950";

                a.innerHTML = `
                    <span class="shrink-0 w-9 h-9 rounded-lg bg-white/10 p-1.5 flex items-center justify-center overflow-hidden">
                        <img
                            src="${favicon}"
                            alt=""
                            width="36"
                            height="36"
                            loading="lazy"
                            decoding="async"
                            class="w-full h-full object-contain"
                            onerror="this.style.display='none'"
                        />
                    </span>
                    <span class="min-w-0">
                        <span class="block text-[11px] font-mono uppercase tracking-wider text-stone-400 truncate">${domain}</span>
                        <span class="block text-sm font-medium text-white truncate group-hover:text-cyan-200 transition-colors">${friend.name}</span>
                    </span>`;

                return a;
            }

            const grid = document.getElementById("friends-grid");
            const fragment = document.createDocumentFragment();
            shuffle(friends).forEach((friend, index) => {
                fragment.appendChild(cardFor(friend, index));
            });
            grid.appendChild(fragment);
        </script>
    </body>
</html>
